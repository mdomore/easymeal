<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micmoe.ddns.net</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 2.2em; }
        .subtitle { color: #666; margin-bottom: 32px; }
        .links { display: flex; flex-direction: column; gap: 14px; }
        .link-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 24px;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .link-title { font-size: 1.2em; font-weight: 600; margin-bottom: 4px; }
        .link-desc { font-size: 0.9em; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>micmoe.ddns.net</h1>
        <p class="subtitle">Your apps</p>
        <div class="links">
            <a href="/easymeal/" class="link-card">
                <div class="link-title">EasyMeal</div>
                <div class="link-desc">Recipe collection and meal planning</div>
            </a>
            <a href="/mymusicalroom/" class="link-card">
                <div class="link-title">My Musical Room</div>
                <div class="link-desc">Guitar learning resources and music sheets</div>
            </a>
        </div>
    </div>
</body>
</html>
