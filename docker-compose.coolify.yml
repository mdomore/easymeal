# Production compose for Coolify (Docker Compose build pack)
# - No host port bindings (Coolify/Traefik handles routing)
# - Domain + Traefik labels are managed by Coolify (set in dashboard/API)
# - Connects to the existing Supabase stack via the external network
services:
  api:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://postgres:${SUPABASE_POSTGRES_PASSWORD}@supabase-db:5432/easymeal
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-photos}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://micmoe.ddns.net}
      ENVIRONMENT: production
    expose:
      - "8000"
    networks:
      - supabase_default

networks:
  supabase_default:
    external: true
