# Production compose for Coolify (or manual deploy with Traefik)
# - No host port bindings (Coolify/Traefik handles routing)
# - Connects to existing Supabase stack via external network
services:
  api:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://postgres:${SUPABASE_POSTGRES_PASSWORD}@supabase-db:5432/easymeal
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-photos}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://micmoe.ddns.net}
      ENVIRONMENT: production
    networks:
      - coolify
      - supabase_default
    labels:
      - traefik.enable=true
      - traefik.http.routers.easymeal-http.rule=Host(`micmoe.ddns.net`) && PathPrefix(`/easymeal`)
      - traefik.http.routers.easymeal-http.entrypoints=http
      - traefik.http.routers.easymeal-http.middlewares=easymeal-redirect
      - traefik.http.middlewares.easymeal-redirect.redirectscheme.scheme=https
      - traefik.http.routers.easymeal.rule=Host(`micmoe.ddns.net`) && PathPrefix(`/easymeal`)
      - traefik.http.routers.easymeal.entrypoints=https
      - traefik.http.routers.easymeal.tls=true
      - traefik.http.routers.easymeal.tls.certresolver=letsencrypt
      - traefik.http.routers.easymeal.middlewares=easymeal-strip
      - traefik.http.middlewares.easymeal-strip.stripprefix.prefixes=/easymeal
      - traefik.http.services.easymeal.loadbalancer.server.port=8000

networks:
  coolify:
    external: true
  supabase_default:
    external: true
